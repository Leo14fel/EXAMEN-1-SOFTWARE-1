[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "examen-sw1-backend"
version = "0.0.0"
description = "Base FastAPI para el proyecto de Examen SW1"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "sqlalchemy==2.0.52",
  "alembic==1.19.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyJWT==2.13.0",
  "pwdlib[argon2]==0.3.1",
  "psycopg[binary]==3.3.5",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
